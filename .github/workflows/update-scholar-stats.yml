name: Update Scholar Stats

on:
  schedule:
    - cron: "17 2 * * *" # daily at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scholarly==1.7.11"

      - name: Print environment versions
        run: |
          python -V
          python -c "import scholarly,sys; print('scholarly', scholarly.__version__); print('python', sys.version)"

      - name: Fetch scholar stats
        run: python scripts/fetch_scholar_stats.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar_stats.json
          git diff --staged --quiet || git commit -m "chore: update scholar stats"
          git push